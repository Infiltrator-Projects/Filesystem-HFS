# SPDX-License-Identifier: GPL-3.0-or-later
name: Qualify Common V2 hosted-only HFS.so
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test actual V2 interface
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Verify installed package carries only V2 SO and PDF
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" = 2
          module="$stage/System/Filesystems/HFS.so"
          test -s "$module"
          cmp "build/HFS.so" "$module"
          bash tests/check_v2_exports.sh "$module"
          test -s "$stage/System/Resources/Documentation/Filesystem-HFS.pdf"
          test "$(find "$stage" -name '*.ko' | wc -l)" = 0
      - uses: actions/upload-artifact@v4
        with:
          name: HFS-hosted-v2-unqualified-for-boot
          path: |
            build/HFS.so
            docs/HFS.pdf
