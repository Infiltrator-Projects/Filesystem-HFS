name: HFS independent SO build and ABI tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  hfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build independent HFS.so
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run independent ABI test
        run: |
          ctest --test-dir build --output-on-failure
          test -f build/HFS.so
          nm -D build/HFS.so | grep -F infiltrator_filesystem_hfs_v1
      - uses: actions/upload-artifact@v4
        with:
          name: HFS.so
          path: build/HFS.so

      - name: Verify exactly one PDF per runtime SO
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -f "$stage/System/Filesystems/HFS.so"
          test -f "$stage/System/Resources/Documentation/Filesystem-HFS/HFS.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-HFS/HFS.pdf")" = '%PDF-'
