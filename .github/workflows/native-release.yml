# SPDX-License-Identifier: GPL-3.0-or-later
# Qualify source-owned native and portable Common V2 carriers and their
# embedded freestanding reader. Independent filesystem qualification.
name: Qualify and release HFS native Common V2 filesystem module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install portable and native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev hfsutils
      - name: Qualify portable DEB with actual V2 ELF
        run: |
          set -euo pipefail
          python3 standalone/release.py release
          bootstrap="$(find dist -maxdepth 1 -type f -name '*.run' -print -quit)"
          test -s "$bootstrap"
          test "$(wc -c < "$bootstrap")" -lt 8192
          if grep -aF '__IFS_SOURCE_PAYLOAD_BELOW__' "$bootstrap"; then exit 1; fi
          grep -F "$GITHUB_SHA" "$bootstrap"
          python3 standalone/check-package.py dist/*.deb --profile portable
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -type f -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -type f -name '*.ko' | wc -l)" = 0
          mkdir -p "$RUNNER_TEMP/portable"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable"
          test "$(find "$RUNNER_TEMP/portable" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/portable/System/Filesystems/HFS.so"
      - name: Qualify native source-first RUN with same V2 boundary
        run: |
          set -euo pipefail
          runfile="$(find dist -maxdepth 1 -type f -name '*.run' -print -quit)"
          bash "$runfile" --profile aggressive --system-package-mode --build-only --output "$RUNNER_TEMP/native"
          deb="$(find "$RUNNER_TEMP/native" -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb"
          python3 standalone/check-package.py "$deb" --profile aggressive
          mkdir -p "$RUNNER_TEMP/native-root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/native-root"
          test "$(find "$RUNNER_TEMP/native-root" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/native-root/System/Filesystems/HFS.so"
          test "$(find "$RUNNER_TEMP/native-root" -name '*.ko' | wc -l)" = 0
      - name: Validate packaged Common V2 carrier and freestanding reader
        run: |
          set -euo pipefail
          for module in \
            "$RUNNER_TEMP/portable/System/Filesystems/HFS.so" \
            "$RUNNER_TEMP/native-root/System/Filesystems/HFS.so"; do
            bash tests/check-freestanding-v2.sh "$module"
          done
      - name: Independent HFS mount and file round-trip on both packaged formatters
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/format-check" -DBUILD_TESTING=ON
          cmake --build "$RUNNER_TEMP/format-check" --target hfs-native-format-test --parallel 2
          oracle=$(command -v hmount)
          for profile in portable native-root; do
            sh tests/format_oracle.sh "$RUNNER_TEMP/format-check/hfs-native-format-test" \
              "$RUNNER_TEMP/$profile/System/Filesystems/HFS.so" "$oracle"
          done
      - name: Determine whether this version needs a new release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          published=$(git ls-remote --tags --refs origin "refs/tags/$tag")
          if [[ -n "$published" ]]; then
            test "$(gh release view "$tag" --json tagName --jq .tagName)" = "$tag"
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_version=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hfs-common-v2-qualified-release
          path: dist/*
          if-no-files-found: error
  publish:
    needs: qualify
    if: needs.qualify.outputs.new_version == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hfs-common-v2-qualified-release
          path: dist
      - name: Publish immutable HFS V2 DEB and native RUN only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" -eq 1
          ! find dist -name '*.ko' | grep .
          (cd dist && sha256sum -- *.deb *.run) > "$RUNNER_TEMP/hfs-hashes.txt"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
            test "$target" = "$GITHUB_SHA" || {
              echo "Existing immutable HFS release belongs to a different commit" >&2
              exit 1
            }
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Unqualified existing HFS tag $tag" >&2
            exit 1
          else
            gh release create "$tag" dist/*.deb dist/*.run \
              --target "$GITHUB_SHA" \
              --title "Classic HFS Common V2 freestanding reader $version" \
              --notes "Exact packaged Common V2 HFS.so, no V1 or .ko. Independently formatted HFS real-media stat/list/read; hosted native flat-root inline-extent relocation, growth slack verification and durable write/flush interruption recovery; freestanding reader remains read-only. Foreign or unsupported catalogue and journal layouts fail closed."
          fi
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "$tag" -p '*.deb' -p '*.run' \
            --dir "$RUNNER_TEMP/release-check"
          (cd "$RUNNER_TEMP/release-check" &&
            sha256sum -c "$RUNNER_TEMP/hfs-hashes.txt")
          echo "HFS_IMMUTABLE_RELEASE_PASS $tag $GITHUB_SHA"
