# SPDX-License-Identifier: GPL-3.0-or-later
# Real native Common V2 HFS reader. Publish only exact-head signed package
# hashes after native, freestanding, production validator and OVMF checks pass.
name: Qualify and release HFS Common V2 BOOT-ready DEB and RUN
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install portable and native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev
      - name: Qualify portable DEB with actual V2 ELF
        run: |
          set -euo pipefail
          python3 standalone/release.py release
          python3 standalone/check-package.py dist/*.deb --profile portable
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -type f -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -type f -name '*.ko' | wc -l)" = 0
          mkdir -p "$RUNNER_TEMP/portable"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable"
          test "$(find "$RUNNER_TEMP/portable" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/portable/System/Filesystems/HFS.so"
      - name: Qualify native source-embedded RUN with same V2 boundary
        run: |
          set -euo pipefail
          runfile="$(find dist -maxdepth 1 -type f -name '*.run' -print -quit)"
          bash "$runfile" --profile aggressive --system-package-mode --build-only --output "$RUNNER_TEMP/native"
          deb="$(find "$RUNNER_TEMP/native" -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb"
          python3 standalone/check-package.py "$deb" --profile aggressive
          mkdir -p "$RUNNER_TEMP/native-root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/native-root"
          test "$(find "$RUNNER_TEMP/native-root" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/native-root/System/Filesystems/HFS.so"
          test "$(find "$RUNNER_TEMP/native-root" -name '*.ko' | wc -l)" = 0
      - name: Validate actual portable and CPU-native installed HFS.so against BOOT 0.1.77
        shell: bash
        run: |
          set -euo pipefail
          boot=infiltrator-boot_0.1.77_amd64.deb
          curl -fsSL --retry 3 \
            "https://github.com/Infiltrator-Projects/Boot/releases/download/v0.1.77/$boot" \
            -o "$RUNNER_TEMP/$boot"
          printf '%s  %s\n' \
            4b2fa8eaa116b7e719329c5bbaa39ee3a093fbe1c1eac0c57440d0f82217d8a5 \
            "$RUNNER_TEMP/$boot" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/$boot" "$RUNNER_TEMP/boot"
          validator="$RUNNER_TEMP/boot/usr/lib/infiltrator-boot/validate-module"
          for module in \
             "$RUNNER_TEMP/portable/System/Filesystems/HFS.so" \
             "$RUNNER_TEMP/native-root/System/Filesystems/HFS.so"; do
            test -s "$module"
            readelf -SW "$module" | grep -F .infiltrator_boot
            ! nm -D --defined-only "$module" | grep -E 'infiltrator_filesystem_.*_v1'
            "$validator" "$module"
          done
          echo HFS_PACKAGED_COMMON_V2_BOTH_VARIANTS_VALIDATED

      - uses: actions/upload-artifact@v4
        with:
          name: hfs-boot-qualified-release
          path: dist/*
          if-no-files-found: error
  publish:
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hfs-boot-qualified-release
          path: dist
      - name: Require same-head native Common V2 and actual OVMF handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100"
          for attempt in $(seq 1 150); do
            statuses=$(gh api "$endpoint" \
              --jq '.workflow_runs[] | .name + ":" + (.conclusion // .status)')
            if printf '%s\n' "$statuses" |
                 grep -Fxq 'Qualify HFS native freestanding Common V2 ELF:failure' ||
               printf '%s\n' "$statuses" |
                 grep -Fxq 'Qualify Common V2 hosted-only HFS.so:failure'; then
              echo "HFS same-head V2 or firmware/OVMF gate failed" >&2
              exit 1
            fi
            if printf '%s\n' "$statuses" |
                 grep -Fxq 'Qualify HFS native freestanding Common V2 ELF:success' &&
               printf '%s\n' "$statuses" |
                 grep -Fxq 'Qualify Common V2 hosted-only HFS.so:success'; then
              echo "HFS_EXACT_HEAD_UEFI_NATIVE_PASS $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Exact-head HFS OVMF qualification not established" >&2
          exit 1
      - name: Publish immutable HFS V2 DEB and native RUN only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" -eq 1
          ! find dist -name '*.ko' | grep .
          (cd dist && sha256sum -- *.deb *.run) > "$RUNNER_TEMP/hfs-hashes.txt"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
            test "$target" = "$GITHUB_SHA" || {
              echo "Existing immutable HFS release belongs to a different commit" >&2
              exit 1
            }
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Unqualified existing HFS tag $tag" >&2
            exit 1
          else
            gh release create "$tag" dist/*.deb dist/*.run \
              --target "$GITHUB_SHA" \
              --title "Classic HFS Common V2 freestanding reader $version" \
              --notes "Exact packaged Common V2 HFS.so, no V1 or .ko. Independently formatted HFS real-media stat/list/read, bounded inline extents, validated metadata and source nonmutation; BOOT 0.1.77 unmodified validator on portable and native modules; disposable OVMF EFI Linux kernel/initramfs handoff and corrupt-media refusal. Unsupported catalogue features fail closed."
          fi
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "$tag" -p '*.deb' -p '*.run' \
            --dir "$RUNNER_TEMP/release-check"
          (cd "$RUNNER_TEMP/release-check" &&
            sha256sum -c "$RUNNER_TEMP/hfs-hashes.txt")
          echo "HFS_IMMUTABLE_RELEASE_PASS $tag $GITHUB_SHA"
